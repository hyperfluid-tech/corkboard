name: Reusable Golden Tests Workflow

on:
  workflow_call:
    inputs:
      override:
        description: 'Whether to run in override mode to update reference goldens'
        required: false
        type: boolean
        default: false
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

jobs:
  run_goldens:
    runs-on: ubuntu-latest
    env:
      CORKBOARD_CSP_ALLOWED_ORIGINS: "http://localhost:3000,https://fonts.googleapis.com,https://fonts.gstatic.com,https://picsum.photos,https://upload.wikimedia.org"
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        if: ${{ inputs.override }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check out the repo (normal)
        if: ${{ !inputs.override }}
        uses: actions/checkout@v4

      - name: Check out the repo (with app token)
        if: ${{ inputs.override }}
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Compile Tailwind CSS
        run: npm run build:css

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Chrome, ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick chromium-browser

      - name: Build golden tool
        run: cargo build --bin golden

      - name: Run app server in background
        run: |
          cargo run &
          echo $! > server.pid
          sleep 5

      - name: Generate and compare golden images (normal)
        if: ${{ !inputs.override }}
        run: cargo run --bin golden

      - name: Generate golden images (override)
        if: ${{ inputs.override }}
        run: cargo run --bin golden -- --override

      - name: Stop app server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid)
            rm server.pid
          fi

      - name: Verify no golden test diffs exist
        if: ${{ !inputs.override }}
        run: |
          if [ -d "tests/golden/diffs" ] && [ "$(ls -A tests/golden/diffs)" ]; then
            echo "❌ Golden test mismatches found! Check the uploaded diff artifacts."
            ls -la tests/golden/diffs
            exit 1
          else
            echo "✅ All golden checks passed!"
          fi

      - name: Upload golden diffs on failure
        if: ${{ !inputs.override && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: tests/golden/diffs/

      - name: Commit and push changes
        if: ${{ inputs.override }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add tests/golden/
          
          if git diff --cached --quiet; then
            echo "No changes to golden reference images."
          else
            git commit -m "chore: update golden reference images"
            git push origin HEAD:${{ github.ref_name }}
          fi
