name: Update Golden Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_goldens:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Chrome, ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick chromium-browser

      - name: Build golden tool
        run: cargo build --bin golden

      - name: Run app server in background
        run: |
          cargo run &
          echo $! > server.pid
          sleep 5

      - name: Generate golden images in override mode
        run: cargo run --bin golden -- --override

      - name: Stop app server
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid)
            rm server.pid
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage all modified/new golden reference images
          git add tests/golden/
          
          # Check if there are any changes staged
          if git diff --cached --quiet; then
            echo "No changes to golden reference images."
          else
            git commit -m "chore: update golden reference images"
            git push origin HEAD:${{ github.ref_name }}
          fi
