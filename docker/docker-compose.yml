version: '3.8'

services:
  corkboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # args:
      #   - CARGO_FEATURES=git # Uncomment to build with Git support
    container_name: corkboard_blog
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      - ../articles:/app/articles
      - ../config.toml:/app/config.toml
      - ../assets:/app/assets
    environment:
      # - PUID=1000
      # - PGID=1000
      - RUST_LOG=corkboard=info,axum=info
      # The internal port the application listens on inside the container
      - CORKBOARD_PORT=3000
      # The external URL used to access the blog (matches host port 8080)
      - CORKBOARD_BASE_URL=http://your-domain-here.com:8080
      - CORKBOARD_BLOG_TITLE=My blog
      - CORKBOARD_BLOG_AUTHOR=Author
      - CORKBOARD_ARTICLES_DIR=/app/articles
      - CORKBOARD_TRUNCATE_LINES=15
      # - CORKBOARD_THUMBNAIL_SHOW_ARTICLES=false
      # - CORKBOARD_SOCIAL_LINKS=https://github.com/your-username,https://linkedin.com/in/your-username,https://twitter.com/your-username
      # - CORKBOARD_CORS_ALLOWED_ORIGINS=http://your-domain-here.com:8080
      # - CORKBOARD_CSP_ALLOWED_ORIGINS=http://your-domain-here.com:8080,https://fonts.googleapis.com,https://fonts.gstatic.com
      # - CORKBOARD_BLOG_LICENSE=CC 4.0 BY-SA
      # - CORKBOARD_BLOG_LICENSE_URL=https://creativecommons.org/licenses/by-sa/4.0/
      # Git Repository Settings (Requires building with CARGO_FEATURES=git)
      # - CORKBOARD_GIT__LINK=https://github.com/user/repo.git
      # - CORKBOARD_GIT__FOLDER=
      # - CORKBOARD_GIT__ASSETS_FOLDER=
      # - CORKBOARD_GIT__USERNAME=
      # - CORKBOARD_GIT__PASSWORD=
      # - CORKBOARD_GIT__BRANCH=main
