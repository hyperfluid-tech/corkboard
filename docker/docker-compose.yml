version: '3.8'

services:
  carbon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: carbon_blog
    restart: unless-stopped
    ports:
      # Map the host's 8080 to the container's 3000
      - "8080:3000"
    volumes:
      # Mount a local articles directory and config file
      - ../articles:/app/articles
      - ../config.toml:/app/config.toml
    environment:
      # Optional: Control file ownership on bind mounts
      # - PUID=1000
      # - PGID=1000

      # Configure Carbon environment
      - RUST_LOG=carbon=info,axum=info
      - CARBON_PORT=3000
      - CARBON_ARTICLES_DIR=/app/articles
      # - CARBON_LINKEDIN_URL=https://linkedin.com/in/your-username
      # - CARBON_GITHUB_URL=https://github.com/your-username
      # - CARBON_TWITTER_URL=https://twitter.com/your-username
