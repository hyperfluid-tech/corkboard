[package]
name = "corkboard"
version = "0.4.7"
edition = "2024"
default-run = "corkboard"

[features]
git = ["dep:gix", "dep:tempfile", "dep:curl-sys", "dep:openssl-sys", "dep:openssl-probe"]

[dependencies]
askama = "0.16.0"
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
config = "0.15.23"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
slug = "0.1.6"
syntect = "5.3.0"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.2", features = ["fs", "cors", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
headless_chrome = "1.0.21"
url = { version = "2.5.8", features = ["serde"] }
gix = { version = "0.84", features = ["blocking-network-client", "blocking-http-transport-curl"], optional = true }
tempfile = { version = "3.27.0", optional = true }
curl-sys = { version = "0.4", features = ["ssl"], optional = true }
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }
openssl-probe = { version = "0.1.6", optional = true }



[[bin]]
name = "golden"
path = "tests/bin/golden/main.rs"
