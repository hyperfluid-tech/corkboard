<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=1200" name="viewport">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">
  <title>Thumbnail Source - {{ current_title }}</title>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 1200px !important;
      height: 630px !important;
      overflow: hidden !important;
      background-image: url('/static/image/screen.webp') !important;
      background-size: auto !important;
      background-repeat: repeat !important;
      position: relative !important;
    }

    .card {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) rotate(-1.5deg) !important;
      width: 800px !important;
      background-color: #ffffff !important;
      border: 1px solid #e4e2dd !important;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 64px !important;
      overflow: visible !important;
    }

    .paper-shader-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      clip-path: inset(0);
      mix-blend-mode: multiply;
    }

    .card h1 {
      font-family: "Playfair Display", Georgia, serif !important;
      font-size: 72px !important;
      font-weight: 700 !important;
      line-height: 1.2 !important;
      color: #162839 !important;
      text-align: center !important;
      letter-spacing: -0.02em !important;
      margin: 0 !important;
      position: relative;
      z-index: 3;
    }

    .title-highlight {
      background: linear-gradient(104deg,
              rgba(253, 224, 71, 0.15) 0.9%,
              rgba(253, 224, 71, 0.75) 2.4%,
              rgba(253, 224, 71, 0.65) 5.8%,
              rgba(253, 224, 71, 0.75) 93%,
              rgba(253, 224, 71, 0.35) 96%,
              rgba(253, 224, 71, 0) 98%);
      background-size: 100% 88%;
      background-repeat: no-repeat;
      background-position: 0 85%;
      padding: 0.1em 0.35em;
      margin: 0 -0.35em;
      border-radius: 0.5em 1.2em 0.8em 1.5em / 0.5em 0.8em 1.2em 0.5em;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      mix-blend-mode: multiply;
      display: inline;
    }
  </style>
</head>

<body>
  <div class="card paper-card">
    <h1><span class="title-highlight">{{ current_title }}</span></h1>
  </div>

  <script src="/static/paper-shader.js?v=2"></script>
</body>

</html>
