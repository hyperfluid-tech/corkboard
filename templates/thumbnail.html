<!DOCTYPE html>
<html class="light" lang="en">

<head>
  {% include "components/head.html" %}
  <title>Thumbnail Source - {{ current_title }}</title>

  <style>
    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 1200px !important;
      height: 630px !important;
      overflow: hidden !important;
      position: relative !important;
    }

    header {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) rotate(-1.5deg) !important;
      width: fit-content !important;
      min-width: 800px !important;
      max-width: 1100px !important;
      aspect-ratio: 800 / 180 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 48px 64px !important;
      pointer-events: none !important;
      transition: none !important;
      cursor: default !important;
      z-index: 10 !important;
    }

    header h1 {
      font-size: 72px !important;
      line-height: 1.2 !important;
    }

    .pushpin {
      top: -24px !important;
      width: 128px !important;
    }

    .thumbnail-pencil {
      position: absolute !important;
      bottom: 70px !important;
      left: 90px !important;
      width: 800px !important;
      transform: rotate(-20deg) !important;
      transform-origin: center center !important;
      pointer-events: none !important;
      z-index: 10 !important;
      filter: drop-shadow(4px 6px 6px rgba(0, 0, 0, 0.35)) !important;
    }

    /* Article snippet cards — spread towards corners */
    .thumb-article {
      position: absolute !important;
      background: #ffffff !important;
      border: 1px solid #e4e2dd !important;
      padding: 28px 36px !important;
      width: 500px !important;
      pointer-events: none !important;
      z-index: 5 !important;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14) !important;
    }

    .thumb-article-title {
      font-family: "Playfair Display", Georgia, serif !important;
      font-size: 26px !important;
      font-weight: 700 !important;
      color: #162839 !important;
      line-height: 1.3 !important;
      margin: 0 0 6px 0 !important;
    }

    .thumb-article-sub {
      font-family: "Source Sans 3", system-ui, sans-serif !important;
      font-size: 15px !important;
      font-style: italic !important;
      color: #4a4e54 !important;
      line-height: 1.4 !important;
      margin: 0 !important;
      opacity: 0.85 !important;
    }

    /* Top-left corner */
    .thumb-article:nth-child(1) {
      top: -30px !important;
      left: -40px !important;
      transform: rotate(3deg) !important;
    }

    /* Top-right corner */
    .thumb-article:nth-child(2) {
      top: -25px !important;
      right: -30px !important;
      transform: rotate(-2.5deg) !important;
    }

    /* Bottom-right corner */
    .thumb-article:nth-child(3) {
      bottom: -35px !important;
      right: -20px !important;
      transform: rotate(2deg) !important;
    }

    /* Bottom-left corner */
    .thumb-article:nth-child(4) {
      bottom: -30px !important;
      left: -35px !important;
      transform: rotate(-3deg) !important;
    }

    /* Left edge */
    .thumb-article:nth-child(5) {
      top: 50% !important;
      left: -60px !important;
      transform: translateY(-50%) rotate(2.5deg) !important;
    }

    /* Right edge */
    .thumb-article:nth-child(6) {
      top: 50% !important;
      right: -50px !important;
      transform: translateY(-50%) rotate(-2deg) !important;
    }
  </style>
</head>

<body>
  <div class="thumbnail">
    {% for article in articles %}
    <div class="thumb-article paper-card">
      <p class="thumb-article-title">{{ article.title }}</p>
      {% if let Some(sub) = article.subheading %}
      <p class="thumb-article-sub">{{ sub }}</p>
      {% endif %}
    </div>
    {% endfor %}

    {% include "components/header.html" %}
    <script src="/static/paper-shader.js?v=2"></script>
    <img class="thumbnail-pencil" src="/static/image/pencil.svg" alt="pencil" />
  </div>
</body>

</html>
