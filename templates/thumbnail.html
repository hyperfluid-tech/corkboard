<!DOCTYPE html>
<html class="light" lang="en">

<head>
  {% include "components/head.html" %}
  <title>Thumbnail Source - {{ current_title }}</title>

  <style>
    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 1200px !important;
      height: 630px !important;
      overflow: hidden !important;
      position: relative !important;
    }

    header {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) rotate(-1.5deg) !important;
      width: fit-content !important;
      min-width: 800px !important;
      max-width: 1100px !important;
      aspect-ratio: 800 / 180 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 48px 64px !important;
      pointer-events: none !important;
      transition: none !important;
      cursor: default !important;
      z-index: 10 !important;
    }

    header h1 {
      font-size: 72px !important;
      line-height: 1.2 !important;
    }

    .pushpin {
      top: -24px !important;
      width: 128px !important;
    }

    .thumbnail-pencil {
      position: absolute !important;
      bottom: 70px !important;
      left: 90px !important;
      width: 800px !important;
      transform: rotate(-20deg) !important;
      transform-origin: center center !important;
      pointer-events: none !important;
      z-index: 10 !important;
      filter: drop-shadow(4px 6px 6px rgba(0, 0, 0, 0.35)) !important;
    }

    /* Article snippet cards — spread towards corners, stackable */
    .thumb-article {
      --stack: 0;
      position: absolute !important;
      background: #ffffff !important;
      border: 1px solid #e4e2dd !important;
      padding: 28px 36px !important;
      width: 500px !important;
      pointer-events: none !important;
      z-index: 5 !important;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14) !important;
    }

    .thumb-article-title {
      font-family: "Playfair Display", Georgia, serif !important;
      font-size: 26px !important;
      font-weight: 700 !important;
      color: #162839 !important;
      line-height: 1.3 !important;
      margin: 0 0 6px 0 !important;
    }

    .thumb-article-sub {
      font-family: "Source Sans 3", system-ui, sans-serif !important;
      font-size: 15px !important;
      font-style: italic !important;
      color: #4a4e54 !important;
      line-height: 1.4 !important;
      margin: 0 !important;
      opacity: 0.85 !important;
    }

    /* Top-left corner — steep angle */
    .thumb-pos-0 {
      top: calc(-60px + var(--stack) * 18px) !important;
      left: calc(-80px + var(--stack) * 25px) !important;
      transform: rotate(calc(-8deg + var(--stack) * 2deg)) !important;
    }

    /* Top-center — slight tilt */
    .thumb-pos-1 {
      top: calc(-70px + var(--stack) * 18px) !important;
      left: calc(50% - 250px + var(--stack) * 20px) !important;
      transform: rotate(calc(4deg - var(--stack) * 1.5deg)) !important;
    }

    /* Top-right corner — steep angle */
    .thumb-pos-2 {
      top: calc(-55px + var(--stack) * 18px) !important;
      right: calc(-70px + var(--stack) * 25px) !important;
      transform: rotate(calc(7deg - var(--stack) * 2deg)) !important;
    }

    /* Bottom-left corner — steep angle */
    .thumb-pos-3 {
      bottom: calc(-65px + var(--stack) * 18px) !important;
      left: calc(-70px + var(--stack) * 25px) !important;
      transform: rotate(calc(6deg - var(--stack) * 1.5deg)) !important;
    }

    /* Bottom-center — slight tilt */
    .thumb-pos-4 {
      bottom: calc(-75px + var(--stack) * 18px) !important;
      left: calc(50% - 250px - var(--stack) * 15px) !important;
      transform: rotate(calc(-3deg + var(--stack) * 1deg)) !important;
    }

    /* Bottom-right corner — steep angle */
    .thumb-pos-5 {
      bottom: calc(-55px + var(--stack) * 18px) !important;
      right: calc(-60px + var(--stack) * 25px) !important;
      transform: rotate(calc(-7deg + var(--stack) * 2deg)) !important;
    }
  </style>
</head>

<body>
  <div class="thumbnail">
    {% for article in articles %}
    <div class="thumb-article thumb-pos-{{ loop.index0 % 6 }} paper-card" style="--stack: {{ loop.index0 / 6 }}">
      <p class="thumb-article-title">{{ article.title }}</p>
      {% if let Some(desc) = article.description %}
      <p class="thumb-article-sub">{{ desc }}</p>
      {% endif %}
    </div>
    {% endfor %}

    {% include "components/header.html" %}
    {% if app.is_dev %}
    <script src="/static/script/testing.js?v={{ app.version }}"></script>
    {% endif %}
    <script src="/static/script/paper-shader.js?v={{ app.version }}"></script>
    <img class="thumbnail-pencil" src="/static/image/pencil.svg" alt="pencil" />
  </div>
</body>

</html>
