<aside
  class="fixed lg:sticky inset-y-0 lg:inset-y-auto left-0 w-64 border-r border-primary/20 shadow-2xl z-50 flex flex-col paper-card"
  id="sidebar">
  <nav class="flex-grow p-4 overflow-y-auto bg-white/10 backdrop-blur-sm" aria-label="Articles">
    <div class="relative sidebar-relative-wrapper">
      <svg id="sidebar-active-indicator" xmlns="http://www.w3.org/2000/svg" viewBox="155 86 130 28" aria-hidden="true">
        <defs>
          <filter id="pencilShadow" x="-10%" y="-20%" width="120%" height="160%">
            <feGaussianBlur stdDeviation="1.5" />
          </filter>
          <linearGradient id="indicatorWoodGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b58a5c" />
            <stop offset="20%" stop-color="#ebd2b0" />
            <stop offset="50%" stop-color="#d9b68a" />
            <stop offset="80%" stop-color="#b88a57" />
            <stop offset="100%" stop-color="#8a5c29" />
          </linearGradient>
          <linearGradient id="indicatorLeadGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#333333" />
            <stop offset="20%" stop-color="#888888" />
            <stop offset="50%" stop-color="#444444" />
            <stop offset="80%" stop-color="#222222" />
            <stop offset="100%" stop-color="#111111" />
          </linearGradient>
          <linearGradient id="indicatorYellowTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fce28b" />
            <stop offset="100%" stop-color="#f7b733" />
          </linearGradient>
          <linearGradient id="indicatorYellowMid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f4ab1f" />
            <stop offset="50%" stop-color="#ffcd40" />
            <stop offset="100%" stop-color="#e69900" />
          </linearGradient>
          <linearGradient id="indicatorYellowBot" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#cc8400" />
            <stop offset="100%" stop-color="#7a4f00" />
          </linearGradient>
        </defs>
        <!-- Shadow -->
        <path d="M 165 110 L 220 120 L 280 120 L 280 124 L 220 124 L 165 114 Z"
              fill="rgba(0,0,0,0.15)" filter="url(#pencilShadow)" />
        <!-- Wood taper -->
        <polygon points="184,92 220,80 270,80 270,120 220,120 184,108" fill="url(#indicatorWoodGrad)" />
        <!-- Wood grain lines -->
        <path d="M 195 89.5 Q 205 100 195 110.5" fill="none" stroke="#a3784d" stroke-width="0.5" opacity="0.6"/>
        <path d="M 210 84 Q 225 100 210 116" fill="none" stroke="#a3784d" stroke-width="0.5" opacity="0.6"/>
        <!-- Graphite lead tip -->
        <path d="M 185 92.2 L 165 99 Q 163 100 165 101 L 185 107.8 Z" fill="url(#indicatorLeadGrad)" />
        <path d="M 166 99.5 L 180 96.5" stroke="white" stroke-width="0.75" opacity="0.4" />
        <!-- Yellow body facets -->
        <path d="M 220 80 Q 250 86.5 220 93 L 280 93 L 280 80 Z" fill="url(#indicatorYellowTop)" />
        <path d="M 220 93 Q 250 100 220 107 L 280 107 L 280 93 Z" fill="url(#indicatorYellowMid)" />
        <path d="M 220 107 Q 250 113.5 220 120 L 280 120 L 280 107 Z" fill="url(#indicatorYellowBot)" />
        <!-- Edge highlights -->
        <line x1="220" y1="93" x2="280" y2="93" stroke="white" stroke-width="1.5" opacity="0.4" />
        <line x1="220" y1="107" x2="280" y2="107" stroke="black" stroke-width="1.5" opacity="0.15" />
      </svg>
      <ul class="space-y-4 font-body-md text-primary">
        {% if articles.is_empty() %}
        <li><span class="block p-2 text-outline italic">No entries</span></li>
        {% else %}
        {% for article in articles %}
        <li>
          <a class="block hover:bg-white/30 p-2 rounded transition-colors sidebar-link font-semibold overflow-hidden" href="#{{ article.slug }}"
            data-slug="{{ article.slug }}">
            <span class="sidebar-link-text block lg:truncate">{{ article.title }}</span>
          </a>
        </li>
        {% endfor %}
        {% endif %}
      </ul>
    </div>
  </nav>
</aside>
