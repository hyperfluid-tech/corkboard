<article class="paper-card p-margin-mobile md:p-gutter rounded-sm" id="{{ article.slug }}">
  <img class="pushpin" src="/static/image/pushpin.svg" alt="Pushpin">
  <header class="mb-stack-sm border-b border-surface-variant pb-unit">
    <h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">{{ article.title }}</h2>
    <div class="flex flex-wrap items-center gap-unit text-on-surface-variant font-label-sm text-label-sm">
      <time datetime="{{ article.date.format(" %Y-%m-%d") }}">{{ article.date.format("%B %e, %Y") }}</time>
    </div>
  </header>
  <div class="prose">
    {{ article.content_html|safe }}
  </div>
</article>
